<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today · Act groups mockup v2</title>
<style>
:root{--bg:#eef0f4;--card:#fff;--ink:#16181d;--mut:#7b808c;--line:#e6e8ee;--g:#0f8f6b;--gs:#e3f4ee;--a:#a86a00;--as:#f6ecd9;--r:#c4372f;--rs:#fbe6e4;--b:#2d5bd1;--bs:#e6ecfb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Inter",Segoe UI,sans-serif;padding:20px 16px 40px}
h1{font-size:15px;margin:0 0 4px}.note{color:var(--mut);font-size:12.5px;margin:0 0 16px}
.lab{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin:22px 0 8px}
.v{max-width:1280px;margin:0 auto}.ph{width:390px;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:14px 12px;background:var(--bg)}
.card{background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:0 1px 2px rgba(20,24,40,.05);margin-bottom:12px;min-width:0}
.st{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.rk{font-size:12.5px;background:#f3f4f7;border-radius:8px;padding:3px 8px;white-space:nowrap;color:#444}.rk.a{background:var(--as);color:var(--a);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gs);color:var(--g);white-space:nowrap}
.chip.a{background:var(--as);color:var(--a)}.chip.r{background:var(--rs);color:var(--r)}.chip.b{background:var(--bs);color:var(--b)}.chip.n{background:#f0f1f4;color:var(--mut)}
.sp{flex:1}.mut{color:var(--mut)}
.h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.h b{font-size:15px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:#f6f7fa;border-radius:14px;padding:10px;min-width:0}.ch{display:flex;align-items:baseline;gap:6px;margin:0 2px 8px}.ch b{font-size:13px}.ch a{margin-left:auto;font-size:12px;color:var(--mut);text-decoration:none;white-space:nowrap}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}.row:last-child{margin-bottom:0}
.l1{display:flex;align-items:center;gap:6px;min-width:0}.l1 b{font-size:14px}.tag{font:700 10px ui-monospace,Menlo,monospace;background:#eef0f4;border-radius:5px;padding:1px 5px;color:#555}
.num{font-size:12.5px;color:#444;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num i{font-style:normal;color:var(--mut)}.num i.a{color:var(--a);font-weight:600}
.btn{border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:700;font-size:12.5px;padding:6px 11px;white-space:nowrap}.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.none{font-size:12.5px;color:var(--mut);padding:6px 2px 0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pair .card{margin:0}
summary{list-style:none;display:flex;align-items:baseline;gap:8px;cursor:pointer;min-width:0}summary::-webkit-details-marker{display:none}summary b{font-size:14px;white-space:nowrap}summary .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12.5px}
details[open] summary{margin-bottom:8px}details[open] .s{visibility:hidden}
.rk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rk3 div{background:#f6f7fa;border-radius:10px;padding:8px 10px;min-width:0}.rk3 small{display:block;color:var(--mut);font-size:11.5px}.rk3 b{display:block;font-size:14px;white-space:nowrap}.rk3 span{display:block;font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;gap:8px;align-items:center;padding:5px 0;min-width:0}.ev time{font:12px ui-monospace,Menlo,monospace;color:var(--mut);width:74px;flex:none}.ev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.ev .mut{margin-left:auto;font-size:12px;white-space:nowrap}
.ph .cols,.ph .pair{grid-template-columns:1fr;gap:8px}.ph .col{padding:8px}.ph .card{padding:10px 12px}
@media(max-width:900px){.mac .cols,.mac .pair{grid-template-columns:1fr}}
.m,.p{display:inline}.mac .p{display:none}.ph .m{display:none}.q{font-size:12.5px;color:#444;white-space:nowrap}
.h{flex-wrap:wrap;align-items:center}.h .nm{font-size:13px}
.ph .col{background:none;padding:0}.ph .cols{gap:0}.ph .ch{margin:8px 2px 2px}.ph .ch b{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ph .row{border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 2px;margin:0}.ph .num{margin-top:1px;font-size:12px}.ph .btn{padding:5px 10px}.ph .none{display:none}
.ph .rk3{grid-template-columns:1fr}.ph .rk3 div{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;padding:6px 10px}.ph .rk3 small{grid-column:1/-1}.ph .h{margin-bottom:2px}
</style></head><body>
<div class="v"><h1>Today v3 — risk strip in the Act header · Enter = flagged ready</h1><p class="note">Mockup with sample data. The existing top card (To do, Daily / Weekend) stays above and is not drawn. Strip turns amber/red on Half size, Locked or a no-entry window. iPhone shows only the status and what is abnormal.</p>
<div class="lab">Mac</div><div class="mac" id="mac"></div>
<div class="lab">iPhone 390</div><div class="ph" id="ph"></div></div>
<script>
const row=(s,t,st,sc,q,lv,why,wa,btn,sb,o)=>`<div class="row"><div class="l1"><b>${s}</b><span class="tag">${t}</span><span class="chip ${sc} m">${st}</span><span class="q p">${q}</span><span class="sp"></span><button class="btn ${o?'o':''}"><span class="m">${btn}</span><span class="p">${sb}</span></button></div><div class="num"><span class="m">${q} · ${lv} · </span><i class="${wa?'a':''}">${why}</i><span class="p"> · ${lv}</span></div></div>`;
const H=`
<div class="card"><div class="h"><b>Act</b><span class="dot"></span><b class="nm">Normal</b><span class="rk m">MMT <b>3</b> ideas · 1.35%</span><span class="rk m">SAT step <b>2</b> · 0.30%</span><span class="rk m">COMP <b>4.0%</b></span><span class="rk a">NFP Fri 19:30</span></div><div class="cols">
<div class="col"><div class="ch"><b>Enter</b><span class="mut">2</span><a href="#">7 planned ›</a></div>
${row('AMD','MMT','⚑ Ready','b','#40 · 0.10%','E 182.5 / SL 170','⚑ ready',0,'Place order ›','Place ›')}
${row('XAUUSD','SAT','⚑ Ready','b','0.01 lot · 0.20%','E 2642 / SL 2628','⚑ ready · step 1',0,'Place order ›','Place ›')}</div>
<div class="col"><div class="ch"><b>Check orders</b><span class="mut">1</span><a href="#">1 ordered ›</a></div>
${row('MU','MMT','Ordered','a','#60 · 0.23%','Buy 104.2','2 days · still valid?',1,'Filled ✓','Filled ✓',1)}</div>
<div class="col"><div class="ch"><b>Manage</b><span class="mut">2</span><a href="#">3 holding ›</a></div>
${row('NVDA','MMT','+1.6R','','#40 · +1.6R','stop 165 → 171.60','move stop · frees 1 idea',1,'Move stop ›','Stop ›')}
${row('FFIL','COMP','Holding','','#300 · 0.50%','cap 50%','homework not done',1,'Do homework ›','Homework ›',1)}
<div class="none">1 holding needs nothing</div></div></div></div>
<div class="pair">
<div class="card"><details><summary><b>Risk room<span class="m"> · this week</span></b><span class="s">MMT 3 ideas · SAT step 2 · COMP 4.0%</span><span class="chip">Normal</span></summary>
<div class="rk3"><div><small>Momentum · week</small><b>3 of 4 ideas</b><span>room 1.35% of 1.80%</span></div><div><small>Satellite · week</small><b>Step 2 · 0.30%</b><span>−0.20% of 1.20% · queue free</span></div><div><small>Compounder · open now</small><b>room 4.0%</b><span>heat 2.0% of 6% · regime 75%</span></div></div></details></div>
<div class="card"><details><summary><b><span class="m">Next events</span><span class="p">Events</span></b><span class="s">Thu 19:30 Core PCE · Fri 19:30 NFP</span><span class="chip a"><span class="m">No Sat entries Fri 18:30–20:00</span><span class="p">NFP Fri</span></span></summary>
<div class="ev"><time>Thu 19:30</time><span class="chip r">HIGH</span><b>Core PCE</b><span class="mut">XAU · BTC</span></div>
<div class="ev"><time>Fri 19:30</time><span class="chip r">HIGH</span><b>Non-farm payrolls</b><span class="mut">XAU · USDJPY</span></div>
<div class="ev"><time>Mon 21:00</time><span class="chip a">MED</span><b>Fed speech</b><span class="mut">XAU</span></div></details></div></div>`;
mac.innerHTML=H;ph.innerHTML=H;mac.querySelectorAll('details').forEach(d=>d.open=true);if(location.hash==='#open')ph.querySelectorAll('details').forEach(d=>d.open=true);
</script></body></html>
