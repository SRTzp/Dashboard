<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14161A}
.num{font-variant-numeric:tabular-nums}
.seg{font:600 14px/1 Inter,sans-serif;border:0;border-radius:9px;height:38px;flex:1;background:transparent;color:#5F6672}
.seg.on{background:#fff;color:#14161A;box-shadow:0 1px 2px rgba(20,22,26,.08)}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px;border-top:1px solid #F0F1F4}
.st{font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.hold{color:#0F766E;background:#E3F3F1}.plan{color:#2F5BD3;background:#E8EEFC}.none{color:#5F6672;background:#EEF0F3}
.hw{font-size:12px;color:#9A5B00}
.go{font:600 13px Inter;color:#14161A;border:1px solid #E1E4E9;background:#fff;border-radius:10px;height:44px;padding:0 12px;white-space:nowrap}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px/1 Inter,sans-serif;color:#5F6672;border:0;background:transparent;min-width:52px;min-height:44px;justify-content:center}
.nb.on{color:#14161A;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14161A; background: #F4F5F7; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px">
    <h1 style="margin: 0; font-size: 22px">Watch</h1>
    <div style="flex: 1"></div>
    <button class="go" style="height: 36px" aria-label="Add a stock">+ Add</button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div role="tablist" aria-label="Strategy" style="display: flex; padding: 3px; background: #EAECEF; border-radius: 12px">
      <button class="seg on" role="tab" aria-selected="true">Momentum <span style="color: #5F6672; font-weight: 500">3</span></button>
      <button class="seg" role="tab" aria-selected="false">Compounder <span style="font-weight: 500">1</span></button>
    </div>

    <div style="font-size: 13px; color: #5F6672">3 stocks · <b style="color: #9A5B00">2 need homework</b></div>

    <section aria-label="Momentum watchlist" style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; overflow: hidden">
      <div class="row" style="border-top: 0">
        <div style="flex: 1; min-width: 0"><div style="display: flex; align-items: center; gap: 8px"><b>AAPL</b><span class="st hold">Holding</span></div><div class="hw">Homework not started · adds at 50%</div></div>
        <button class="go">Homework ›</button>
      </div>
      <div class="row">
        <div style="flex: 1; min-width: 0"><div style="display: flex; align-items: center; gap: 8px"><b>AVGO</b><span class="st plan">Plan ready</span></div><div style="font-size: 12px; color: #5F6672">Semis · thesis done 12 Nov</div></div>
        <button class="go">Plan ›</button>
      </div>
      <div class="row">
        <div style="flex: 1; min-width: 0"><div style="display: flex; align-items: center; gap: 8px"><b>PLTR</b><span class="st none">No plan</span></div><div class="hw">Homework not started</div></div>
        <button class="go">Homework ›</button>
      </div>
    </section>

    <details style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; padding: 0 12px" open>
      <summary style="min-height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #5F6672; cursor: pointer">Archived (2)</summary>
      <div class="row" style="min-height: 48px; padding: 6px 0"><b style="width: 48px">ARY</b><span style="font-size: 12px; color: #5F6672; width: 48px">12 Nov</span><span style="flex: 1; font-size: 12px; color: #5F6672; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">too slow</span><button class="go" style="height: 36px">Restore</button></div>
      <div class="row" style="min-height: 48px; padding: 6px 0"><b style="width: 48px">ARX</b><span style="font-size: 12px; color: #5F6672; width: 48px">10 Nov</span><span style="flex: 1; font-size: 12px; color: #5F6672; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">thesis broke after earnings</span><button class="go" style="height: 36px">Restore</button></div>
    </details>

    <div style="font-size: 12px; color: #5F6672">Exchange, sector and RS live in the stock's detail sheet, not on every row.</div>
  </div>

  <nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 6px 8px 22px; background: #fff; border-top: 1px solid #E6E8EC">
    <button class="nb"><span style="width: 18px; height: 3px"></span>Today</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Plan</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Flow</button>
    <button class="nb on" aria-current="page"><span style="width: 18px; height: 3px; border-radius: 2px; background: #14161A"></span>Watch</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Journal</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Port</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
