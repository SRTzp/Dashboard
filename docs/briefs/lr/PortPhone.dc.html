<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
.lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5F6672}
.seg{font:600 13px/1 Inter,sans-serif;border:0;border-radius:9px;height:36px;flex:1;background:transparent;color:#5F6672}
.seg.on{background:#fff;color:#14161A;box-shadow:0 1px 2px rgba(20,22,26,.08)}
.acc{font:700 10px/1 Inter,sans-serif;padding:3px 6px;border-radius:999px;color:#fff}.acc-m{background:#14161A}.acc-f{background:#B4387A}
.tag{font:600 10px/1 'JetBrains Mono',monospace;padding:3px 5px;border-radius:5px}
.t-sat{color:#6741B8;background:#EFE9FA}.t-mmt{color:#2F5BD3;background:#E8EEFC}.t-comp{color:#0F766E;background:#E3F3F1}
.hr{display:flex;align-items:center;gap:8px;min-height:52px;border-top:1px solid #F0F1F4;font-size:13.5px}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px/1 Inter,sans-serif;color:#5F6672;border:0;background:transparent;min-width:52px;min-height:44px;justify-content:center}
.nb.on{color:#14161A;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #14161A; background: #F4F5F7; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 16px 8px"><h1 style="margin: 0; font-size: 22px">Port</h1></header>
  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div role="tablist" aria-label="Account view" style="display: flex; padding: 3px; background: #EAECEF; border-radius: 12px">
      <button class="seg" role="tab" aria-selected="false"><span class="acc acc-m">M</span> Main</button><button class="seg" role="tab" aria-selected="false"><span class="acc acc-f">F</span> Family</button><button class="seg on" role="tab" aria-selected="true">Both</button>
    </div>

    <div style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span class="lbl">Total value</span>
      <b class="num" style="font-size: 26px">฿7.42M</b>
      <div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden"><div style="width: 68%; background: #14161A"></div><div style="width: 32%; background: #B4387A"></div></div>
      <div class="num" style="display: flex; justify-content: space-between; font-size: 12.5px; color: #5F6672"><span><span class="acc acc-m">M</span> ฿5.02M</span><span><span class="acc acc-f">F</span> ฿2.40M</span></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; padding: 12px"><span class="lbl">Open risk</span><div class="num" style="font-size: 13px; padding-top: 6px"><span class="acc acc-m">M</span> <b>0.36%</b> · <span class="acc acc-f">F</span> <b>0.12%</b></div></div>
      <div style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; padding: 12px"><span class="lbl">F futures</span><div class="num" style="padding-top: 6px"><b style="font-size: 18px">1.8×</b> <span style="font-size: 12px; color: #5F6672">S50 + GO</span></div></div>
    </div>

    <section aria-label="Holdings" style="background: #fff; border: 1px solid #ECEEF1; border-radius: 14px; padding: 2px 12px">
      <div class="hr" style="border-top: 0"><b style="width: 48px">S50</b><span class="tag t-sat">SAT</span><span class="acc acc-f">F</span><span class="num" style="flex: 1; text-align: right">฿3.6M <small style="color: #5F6672">notional</small></span></div>
      <div class="hr"><b style="width: 48px">XAU</b><span class="tag t-sat">SAT</span><span class="acc acc-m">M</span><span class="num" style="flex: 1; text-align: right">฿446k</span></div>
      <div class="hr"><b style="width: 48px">AAPL</b><span class="tag t-mmt">MMT</span><span class="acc acc-m">M</span><span class="num" style="flex: 1; text-align: right">฿236k</span></div>
      <div class="hr"><b style="width: 48px">PTT</b><span class="tag t-comp">COMP</span><span class="acc acc-f">F</span><span class="num" style="flex: 1; text-align: right">฿99.0k</span></div>
      <div class="hr"><b style="width: 48px">NVDA</b><span class="tag t-comp">COMP</span><span class="acc acc-m">M</span><span class="acc acc-f">F</span><span class="num" style="flex: 1; text-align: right">฿88.0k</span></div>
    </section>
    <div style="font-size: 12px; color: #5F6672">Read-only · plans and risk rules stay per account</div>
  </div>
  <nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 6px 8px 22px; background: #fff; border-top: 1px solid #E6E8EC">
    <button class="nb"><span style="width: 18px; height: 3px"></span>Today</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Plan</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Flow</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Watch</button>
    <button class="nb"><span style="width: 18px; height: 3px"></span>Journal</button>
    <button class="nb on" aria-current="page"><span style="width: 18px; height: 3px; border-radius: 2px; background: #14161A"></span>Port</button>
  </nav>
</div>
</x-dc>
