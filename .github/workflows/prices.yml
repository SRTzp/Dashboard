# ราคาปิดสัปดาห์ + EMA10 ของหุ้น Core (PX1) + RS line / RS Rating 1–99 ของ Watchlist+Candidates+Core (RS1) → Firestore users/{uid}/prices
# ใช้ secret FIREBASE_SA + FIREBASE_UID · ไม่ commit อะไรกลับ repo
name: prices

on:
  schedule:
    - cron: '30 22 * * 1-4'  # RS1 · จันทร์–พฤหัส 22:30 UTC = หลังตลาด US ปิด (ทั้ง EST/EDT) · 05:30 น. ไทยวันถัดไป
    - cron: '30 23 * * 5'   # เสาร์ 06:30 น. ไทย (ศุกร์ 23:30 UTC)
    - cron: '30 23 * * 6'   # อาทิตย์ 06:30 น. ไทย
  workflow_dispatch: {}      # กดรันเองได้ที่แท็บ Actions → prices → Run workflow

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: RS1 selftest (ไม่แตะเน็ต)
        run: python tests/rs1_selftest.py
      - name: ติดตั้งแพ็กเกจ
        run: pip install --quiet yfinance pandas firebase-admin
      - name: ดึงราคา + เขียน Firestore
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
        run: python scripts/build_prices.py
