# ราคาปิดสัปดาห์ + EMA10 ของหุ้น Core (PX1) + RS line / RS Rating 1–99 ของ Watchlist+Candidates+Core (RS1) → Firestore users/{uid}/prices
# RS2a — build_prices.py now also writes users/{uid}/rs2/* (ranked liquid-US list) · ต้องมี Firestore Rules สำหรับ rs2 (อ่านได้เฉพาะเจ้าของ · เขียนผ่าน service account)
# ใช้ secret FIREBASE_SA + FIREBASE_UID · ไม่ commit อะไรกลับ repo
name: prices

on:
  schedule:
    # CR1 — GitHub delays or drops cron at busy minutes (:00 / :30) → off-peak minutes + a backup run an hour later
    - cron: '17 22 * * 1-4'  # จันทร์–พฤหัส 22:17 UTC = หลังตลาด US ปิด (ทั้ง EST/EDT) · 05:17 น. ไทยวันถัดไป
    - cron: '17 23 * * 5'    # ศุกร์ 23:17 UTC (เสาร์ 06:17 น. ไทย)
    - cron: '17 23 * * 6'    # เสาร์ 23:17 UTC (อาทิตย์ 06:17 น. ไทย)
    - cron: '13 0 * * *'     # backup ทุกวัน 00:13 UTC — ถ้ารอบหลักรันแล้ว build_prices.py เห็น "already fresh" แล้วจบใน ไม่กี่วินาที
  workflow_dispatch: {}      # กดรันเองได้ที่แท็บ Actions → prices → Run workflow (รันเต็มเสมอ ไม่ข้าม)

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # RS2a — ~7 min locally (≈ 5,000 symbols on the weekly full scan + sector lookups); 30 leaves margin on the runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: RS1 selftest (ไม่แตะเน็ต)
        run: python tests/rs1_selftest.py
      - name: RS2a selftest (ไม่แตะเน็ต)
        run: python tests/rs2_selftest.py
      - name: RR4 / CR1 selftest (ไม่แตะเน็ต · RRG bars + ปฏิทิน US)
        run: python tests/rr4_selftest.py
      - name: ติดตั้งแพ็กเกจ
        run: pip install --quiet yfinance pandas firebase-admin
      - name: ดึงราคา + เขียน Firestore
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          PRICES_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/build_prices.py
