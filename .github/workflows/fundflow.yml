# คำนวณ fundflow.json ให้แถบ Regime ในแท็บ "ตลาด" (Dashboard เฟส 4 · งาน P1)
# ไม่ใช้ LLM · ไม่ใช้ secret · เขียนไฟล์ไว้ที่ราก repo ข้าง index.html แล้ว commit กลับ
name: fundflow

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 05:30 น. ไทย วันอังคาร–เสาร์ = หลังตลาด US ปิดทั้งช่วงมี/ไม่มี DST
  workflow_dispatch: {}        # กดรันเองได้ที่แท็บ Actions → fundflow → Run workflow

permissions:
  contents: write

concurrency:
  group: fundflow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: ติดตั้ง yfinance
        run: pip install --quiet yfinance
      - name: ทดสอบสูตร
        run: python scripts/build_fundflow.py --selftest
      - name: ดึงราคา + คำนวณ
        run: python scripts/build_fundflow.py --out fundflow.json
      - name: commit ถ้ามีการเปลี่ยนแปลง
        run: |
          if git diff --quiet -- fundflow.json && git ls-files --error-unmatch fundflow.json >/dev/null 2>&1; then
            echo "ไม่มีอะไรเปลี่ยน"; exit 0
          fi
          git config user.name  "fundflow-bot"
          git config user.email "fundflow-bot@users.noreply.github.com"
          git add fundflow.json
          git commit -m "fundflow: $(python -c 'import json;print(json.load(open("fundflow.json"))["as_of"])')"
          git pull --rebase --autostash
          git push
